<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Check-in — Salty Bay Flips</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230e5c8a'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%8C%8A%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e1116; --card:#171b23; --line:rgba(255,255,255,.09);
    --txt:#e8eaed; --dim:#9aa0a8; --acc:#3e9bff; --good:#39d98a; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:60px}
  .wrap{max-width:640px; margin:0 auto; padding:18px 14px}
  h1{font-size:20px; margin:6px 0 2px}
  .sub{color:var(--dim); font-size:13.5px; margin-bottom:16px}
  .tabs{display:flex; gap:8px; margin:14px 0 18px}
  .tab{flex:1; text-align:center; padding:10px; border-radius:12px;
    background:var(--card); border:1px solid var(--line); color:var(--dim);
    font-weight:600; cursor:pointer; user-select:none}
  .tab.on{color:var(--txt); border-color:var(--acc);
    background:rgba(62,155,255,.12)}
  .q{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px}
  .q label{display:block; font-weight:600; font-size:15px; margin-bottom:8px}
  .q .req{color:var(--bad); margin-left:3px}
  input[type=text],input[type=number],textarea,select{
    width:100%; background:#0c0f14; color:var(--txt);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    font:inherit}
  textarea{min-height:84px; resize:vertical}
  .yn{display:flex; gap:10px}
  .yn button{flex:1; padding:11px; border-radius:10px; font:inherit;
    font-weight:600; border:1px solid var(--line); background:#0c0f14;
    color:var(--dim); cursor:pointer}
  .yn button.on{border-color:var(--acc); color:var(--txt);
    background:rgba(62,155,255,.14)}
  .chk{display:flex; align-items:flex-start; gap:10px; cursor:pointer}
  .chk input{width:22px; height:22px; margin-top:1px; flex:none}
  .send{width:100%; padding:15px; border-radius:14px; border:0; font:inherit;
    font-weight:700; font-size:17px; background:var(--acc); color:#fff;
    cursor:pointer; margin-top:6px}
  .send:disabled{opacity:.55}
  .msg{padding:12px 14px; border-radius:12px; margin:12px 0; font-size:14.5px;
    display:none}
  .msg.err{display:block; background:rgba(255,107,107,.12); color:#ffb3b3}
  .msg.ok{display:block; background:rgba(57,217,138,.12); color:#8fedbd}
  .done{ text-align:center; padding:40px 10px}
  .done .big{font-size:44px}
  /* history */
  .hday{background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; margin-bottom:10px}
  .hday .hd{display:flex; justify-content:space-between; align-items:center;
    cursor:pointer}
  .hday .hd b{font-size:15px}
  .hday .body{display:none; margin-top:10px; border-top:1px solid var(--line);
    padding-top:10px}
  .hday.open .body{display:block}
  .hrow{margin-bottom:9px}
  .hrow .k{color:var(--dim); font-size:12.5px}
  .hrow .v{font-size:14.5px; white-space:pre-wrap}
  .search{margin-bottom:12px}
  /* summary tab (ask abd99a1) - built to be read on a phone, one row per
     number, never a wide table that forces sideways scrolling */
  .sumsec{margin:0 0 18px}
  .sumsec h2{font-size:13px; letter-spacing:.6px; text-transform:uppercase;
             color:var(--dim); margin:0 0 9px; font-weight:700}
  .srow{display:flex; align-items:baseline; gap:10px; padding:9px 0;
        border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:none}
  .srow .lab{flex:1; font-size:14.5px; min-width:0}
  .srow .now{font-size:19px; font-weight:700; font-variant-numeric:tabular-nums}
  .srow .cmp{font-size:12.5px; color:var(--dim); white-space:nowrap;
             font-variant-numeric:tabular-nums}
  .up{color:var(--good,#4ade80)} .down{color:#f6a13c} .flat{color:var(--dim)}
  .pill{display:inline-block; font-size:12px; padding:2px 9px; border-radius:999px;
        border:1px solid var(--line); color:var(--dim)}
  .pill.hit{color:var(--good,#4ade80); border-color:var(--good,#4ade80)}
  .pill.miss{color:#f6a13c; border-color:#f6a13c}
  .sumnote{font-size:12.5px; color:var(--dim); line-height:1.6; margin:10px 0 0}
  .foot{color:var(--dim); font-size:12px; text-align:center; margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="hello">Daily Check-in</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="tabs">
    <div class="tab on" id="tabToday">Today</div>
    <div class="tab" id="tabSum">My numbers</div>
    <div class="tab" id="tabHist">My past entries</div>
  </div>
  <div id="msg" class="msg"></div>
  <div id="form"></div>
  <div id="sum" style="display:none"></div>
  <div id="hist" style="display:none"></div>
  <div class="foot">Salty Bay Flips · answers go straight to the meeting board</div>
</div>
<script>
(function(){
  /* Two roads, one page (Khalil, 8/17/26 — he doesn't want the SBF team
     bookmarking another LLC's domain):
       1. served by Team HQ itself at /checkin/<token>  -> token from the path,
          relative API calls;
       2. hosted on the Salty Bay Flips GitHub org (Pages) with the token after
          a #  -> token from the hash, API calls go to the tunnel. The hash is
          never sent to any server, so the token stays out of logs. */
  const API_BASE = "https://hq.kgequipmentservices.com";
  const hashTok = (location.hash || "").replace(/^#/, "").trim();
  const token = hashTok || location.pathname.split("/").filter(Boolean).pop();
  const base = hashTok ? API_BASE : "";
  const api = p => base + "/api/checkin/" + encodeURIComponent(token) + p;
  const $ = id => document.getElementById(id);
  let QS = [], answers = {};


  /* Same reason as the history page (ask a88f1ca): a DataSift link the team
     pastes must be tappable in their own recap too, so they can see straight
     away that it pasted correctly instead of finding out at the meeting.
     escape FIRST, then linkify - never the other way round. */
  function linkify(v){
    return esc(v).replace(/https?:\/\/[^\s<"]+/g, function(u){
      var nice = /reisift\.io/i.test(u) ? "open in DataSift \u2197" : u;
      return '<a href="' + u + '" target="_blank" rel="noopener" '
           + 'style="color:#8ab4f8">' + nice + '</a>';
    });
  }

  function esc(s){ const d = document.createElement("div");
    d.textContent = String(s == null ? "" : s); return d.innerHTML; }

  function render(qs, filedToday){
    const f = $("form"); f.innerHTML = "";
    if (filedToday){
      const n = document.createElement("div");
      n.className = "msg ok"; n.style.display = "block";
      n.textContent = "You already checked in today. Submitted entries can't be edited — if something needs correcting, submit a new one. Both stay on record; the newest one is what counts.";
      f.appendChild(n);
    }
    qs.forEach(q => {
      const card = document.createElement("div"); card.className = "q";
      const lab = document.createElement("label");
      lab.innerHTML = esc(q.label) + (q.req ? '<span class="req">*</span>' : "");
      card.appendChild(lab);
      let el;
      if (q.kind === "long"){ el = document.createElement("textarea"); }
      else if (q.kind === "number"){ el = document.createElement("input");
        el.type = "number"; el.min = "0"; el.inputMode = "numeric"; }
      else if (q.kind === "text"){ el = document.createElement("input");
        el.type = "text"; }
      else if (q.kind === "choice"){ el = document.createElement("select");
        el.innerHTML = '<option value="">Choose…</option>' +
          q.options.map(o => `<option>${esc(o)}</option>`).join(""); }
      else if (q.kind === "yesno"){
        el = document.createElement("div"); el.className = "yn";
        ["Yes","No"].forEach(v => {
          const b = document.createElement("button"); b.type = "button";
          b.textContent = v;
          b.onclick = () => { answers[q.id] = v;
            el.querySelectorAll("button").forEach(x => x.classList.remove("on"));
            b.classList.add("on"); };
          el.appendChild(b); });
      }
      else if (q.kind === "check"){
        el = document.createElement("label"); el.className = "chk";
        const c = document.createElement("input"); c.type = "checkbox";
        c.onchange = () => answers[q.id] = c.checked;
        const s = document.createElement("span"); s.textContent = "Yes — confirmed";
        el.appendChild(c); el.appendChild(s);
      }
      if (el.tagName === "TEXTAREA" || el.tagName === "INPUT" || el.tagName === "SELECT"){
        el.oninput = el.onchange = () => answers[q.id] = el.value;
      }
      card.appendChild(el);
      f.appendChild(card);
    });
    const b = document.createElement("button"); b.className = "send";
    b.textContent = "Submit today's check-in";
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Sending…";
      try{
        const r = await fetch(api("/submit"), {method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({answers})});
        const j = await r.json();
        if (j.ok){
          $("form").innerHTML = '<div class="done"><div class="big">✅</div>' +
            "<h2>Got it — you're done for today.</h2>" +
            '<div class="sub">Your entry is on the meeting board. See you tomorrow.</div></div>';
          $("msg").className = "msg";
        } else {
          const m = $("msg"); m.className = "msg err";
          m.textContent = j.error || "Something didn't save — try again.";
          b.disabled = false; b.textContent = "Submit today's check-in";
          window.scrollTo({top:0, behavior:"smooth"});
        }
      }catch(e){
        const m = $("msg"); m.className = "msg err";
        m.textContent = "Couldn't reach the server — check your internet and try again.";
        b.disabled = false; b.textContent = "Submit today's check-in";
      }
    };
    f.appendChild(b);
  }

  function renderHist(days){
    const h = $("hist"); h.innerHTML = "";
    const s = document.createElement("input");
    s.type = "text"; s.placeholder = "Filter by date (e.g. 2026-08) or a word…";
    s.className = "search"; h.appendChild(s);
    const list = document.createElement("div"); h.appendChild(list);
    function draw(){
      const q = (s.value || "").toLowerCase();
      list.innerHTML = "";
      days.filter(d => !q || JSON.stringify(d).toLowerCase().includes(q))
        .forEach(d => {
          const el = document.createElement("div"); el.className = "hday";
          if (d.current === false) el.style.opacity = ".55";
          const hd = document.createElement("div"); hd.className = "hd";
          const tag = d.current === false
            ? ' <span style="color:var(--dim);font-size:12px">v' + esc(d.version) + " — superseded</span>"
            : (d.version > 1 ? ' <span style="color:var(--good);font-size:12px">v' + esc(d.version) + " — current</span>" : "")
              + (d.legacy ? ' <span style="color:var(--dim);font-size:12px">from the old form</span>' : "");
          hd.innerHTML = "<b>" + esc(d.date) + "</b>" + tag + "<span style='margin-left:auto'>▾</span>";
          hd.onclick = () => el.classList.toggle("open");
          const body = document.createElement("div"); body.className = "body";
          const a = d.answers || {};
          const known = new Set();
          QS.forEach(qq => {
            known.add(qq.id);
            const v = a[qq.id];
            if (v === null || v === "" || v === undefined) return;
            const row = document.createElement("div"); row.className = "hrow";
            row.innerHTML = '<div class="k">' + esc(qq.label) + "</div>" +
              '<div class="v">' + linkify(v === true ? "Yes" : v) + "</div>";
            body.appendChild(row);
          });
          // Backfilled entries from the old Google Form can carry questions
          // that no longer exist — show them too, nothing hidden.
          Object.keys(a).forEach(k => {
            if (known.has(k)) return;
            const v = a[k];
            if (v === null || v === "" || v === undefined) return;
            const row = document.createElement("div"); row.className = "hrow";
            row.innerHTML = '<div class="k">' + esc(k.replace(/_/g, " ")) + "</div>" +
              '<div class="v">' + linkify(v === true ? "Yes" : v) + "</div>";
            body.appendChild(row);
          });
          el.appendChild(hd); el.appendChild(body); list.appendChild(el);
        });
      if (!list.children.length)
        list.innerHTML = '<div class="sub">Nothing here yet.</div>';
    }
    s.oninput = draw; draw();
  }

  /* ── MY NUMBERS (ask abd99a1) ───────────────────────────────────────
     Khalil, 21 Aug 2026: "give them a certain view that they can view that
     data in a summary format, and make it easy to navigate and user-friendly."

     Before this the only view of their own work was "My past entries" - every
     day as a collapsible row. To know how a week went, Red had to open five
     days and add them up himself. That is an archive, not a summary.

     THREE RULES THIS FOLLOWS:
       1. It reads the SAME computed numbers the meeting board uses, so what
          Red sees here is what Khalil reads out in the room. It does no maths
          of its own beyond the week-over-week difference.
       2. It works WITHOUT targets. Red currently has none configured while
          Reggie does; a view that only worked with targets would be blank for
          the person who asked for it. Week-vs-week always has something to say.
       3. Phone first - one number per row, no wide tables, no sideways scroll.
  */
  function nice(id){
    var q = (QS || []).find(function(x){ return x.id === id; });
    if (!q) return String(id).replace(/_/g, " ");
    /* the form labels end in "today" ("Dials made today"); in a weekly
       summary that word is wrong, so it comes off. */
    return String(q.label).replace(/\s+today\b/i, "");
  }

  function renderSum(sum, history){
    var el = $("sum"); el.innerHTML = "";
    if (!sum){
      el.innerHTML = '<div class="sumnote">Your numbers aren\'t available right '
        + 'now. Your answers are still saved - this is only the summary view.</div>';
      return;
    }
    var wk = sum.weekly || [];
    var cur = wk[0] || {}, prev = wk[1] || {};
    var h = "";

    /* ── this week vs last week ── */
    var keys = Object.keys(cur).filter(function(k){ return k !== "week"; });
    if (keys.length){
      h += '<div class="sumsec"><h2>This week so far</h2>';
      keys.forEach(function(k){
        var a = cur[k] || 0, b = prev[k];
        var cmp = "", cls = "flat";
        if (b === undefined || b === null){
          cmp = "no last week to compare";
        } else if (a > b){ cls = "up";   cmp = "\u25b2 " + (a - b) + " more than last week (" + b + ")"; }
        else if (a < b){   cls = "down"; cmp = "\u25bc " + (b - a) + " fewer than last week (" + b + ")"; }
        else {                            cmp = "same as last week (" + b + ")"; }
        h += '<div class="srow"><div class="lab">' + esc(nice(k)) + "</div>"
           + '<div class="now">' + a + "</div>"
           + '<div class="cmp ' + cls + '">' + esc(cmp) + "</div></div>";
      });
      h += "</div>";
    }

    /* ── today vs the daily target (only if they have targets) ── */
    var day = (sum.today_vs_target || []).filter(function(t){ return t.target; });
    if (day.length){
      h += '<div class="sumsec"><h2>Today against your daily target</h2>';
      day.forEach(function(t){
        var got = (t.value === null || t.value === undefined) ? 0 : t.value;
        h += '<div class="srow"><div class="lab">' + esc(nice(t.metric)) + "</div>"
           + '<div class="now">' + got + "</div>"
           + '<span class="pill ' + (t.met ? "hit" : "miss") + '">'
           + (t.met ? "target " + t.target + " \u2713" : got + " of " + t.target)
           + "</span></div>";
      });
      if (day.every(function(t){ return t.value === null || t.value === undefined; })){
        h += '<div class="sumnote">Nothing logged for today yet - these fill in '
           + "the moment you file today's check-in.</div>";
      }
      h += "</div>";
    }

    /* ── 45-day milestones (Reggie has these; Red does not) ── */
    var ms = sum.milestones_45d || {};
    if (Object.keys(ms).length){
      h += '<div class="sumsec"><h2>Last 45 days</h2>';
      Object.keys(ms).forEach(function(k){
        var m = ms[k];
        h += '<div class="srow"><div class="lab">' + esc(nice(k)) + "</div>"
           + '<div class="now">' + m.value + "</div>"
           + '<span class="pill ' + (m.met ? "hit" : "miss") + '">goal '
           + m.target + "</span></div>";
      });
      h += "</div>";
    }

    /* ── how consistently they are filing ── */
    var days = (history || []).length;
    if (days){
      /* ⛔ COUNT CALENDAR DAYS, NOT ENTRIES. The first cut of this said
         "filed in the last 14 entries" and counted history.slice(-14).length -
         which is 14 every single time once they have 14 entries. A number that
         can only ever report one value tells them nothing about whether they
         are keeping up. Fourteen real days is the question worth answering. */
      var cut = new Date(Date.now() - 14 * 864e5).toISOString().slice(0, 10);
      var recent = (history || []).filter(function(d){
        return (d.date || "") >= cut;
      }).length;
      var last = (history || []).map(function(d){ return d.date || ""; })
                                .sort().slice(-1)[0] || "";
      h += '<div class="sumsec"><h2>Your check-ins</h2>'
         + '<div class="srow"><div class="lab">Days filed, all time</div>'
         + '<div class="now">' + days + "</div></div>"
         + '<div class="srow"><div class="lab">Filed in the last 14 days</div>'
         + '<div class="now">' + recent + "</div>"
         + '<div class="cmp ' + (recent >= 10 ? "up" : "down") + '">'
         + (recent >= 10 ? "keeping up" : "10 of 14 is the working-day pace")
         + "</div></div>"
         + (last ? '<div class="srow"><div class="lab">Most recent</div>'
                 + '<div class="cmp">' + esc(last) + "</div></div>" : "")
         + "</div>";
    }

    if (!h){
      h = '<div class="sumnote">Once you have filed a few days, this is where '
        + "your totals and your week-over-week trend will show up.</div>";
    } else {
      h += '<div class="sumnote">Weeks run Monday to Sunday. These are the same '
         + "numbers shown on the team board, so what you see here is what gets "
         + "discussed in the meeting. Tap <b>My past entries</b> for any single day.</div>";
    }
    el.innerHTML = h;
  }

  function showTab(which){
    ["Today", "Sum", "Hist"].forEach(function(t){
      $("tab" + t).classList.toggle("on", t === which);
    });
    $("form").style.display = which === "Today" ? "" : "none";
    $("sum").style.display  = which === "Sum"   ? "" : "none";
    $("hist").style.display = which === "Hist"  ? "" : "none";
  }
  $("tabToday").onclick = () => showTab("Today");
  $("tabSum").onclick   = () => showTab("Sum");
  $("tabHist").onclick  = () => showTab("Hist");

  // No key in the address at all (someone found the page) — say so honestly
  // rather than letting the fetch fail into "couldn't load".
  if (!token || token === "checkin"){
    $("sub").textContent = "This link isn't valid — ask Khalil for your own link.";
    $("tabs").style.display = "none";
    return;
  }
  fetch(api("/state")).then(r => r.json()).then(j => {
    if (!j.ok){ $("sub").textContent = "This link isn't valid — ask Khalil for a fresh one."; return; }
    QS = j.questions;
    $("hello").textContent = "Daily Check-in — " + j.name;
    $("sub").textContent = j.role + " · fill this out before you clock out";
    render(j.questions, j.filed_today);
    renderHist(j.history || []);
    renderSum(j.summary, j.history || []);
  }).catch(() => { $("sub").textContent = "Couldn't load — refresh the page."; });
})();
</script>
</body>
</html>
